[build]
builder = "nixpacks"

[deploy]
startCommand = "npx prisma migrate deploy && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && HOSTNAME=0.0.0.0 PORT=${PORT:-3000} node .next/standalone/server.js"
healthcheckPath = "/login"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
