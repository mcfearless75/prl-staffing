name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p android-app/app/src/main/java/uk/co/prlsitesolutions/prism
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/gradle/wrapper

          # Download icons
          curl -L -o android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            "https://prl-staffing-production.up.railway.app/icons/icon-192.png"
          cp android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Write source files
        run: |
          # MainActivity.java
          cat > android-app/app/src/main/java/uk/co/prlsitesolutions/prism/MainActivity.java << 'JAVA'
          package uk.co.prlsitesolutions.prism;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_CHOOSER_CODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().setStatusBarColor(0xFF005F8C);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setUserAgentString(settings.getUserAgentString() + " PRISMApp/1.0");

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.contains("prl-staffing-production.up.railway.app")) {
                              return false;
                          }
                          // External links open in browser
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                          return true;
                      }
                  });

                  // File upload support (camera, documents)
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          fileCallback = callback;
                          Intent intent = params.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_CODE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("https://prl-staffing-production.up.railway.app/login");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_CODE && fileCallback != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          }
                      }
                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

          # AndroidManifest.xml
          cat > android-app/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="uk.co.prlsitesolutions.prism">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="PRISM"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          # strings.xml
          cat > android-app/app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PRISM</string>
          </resources>
          XML

          # settings.gradle
          cat > android-app/settings.gradle << 'GRADLE'
          rootProject.name = "PRISM"
          include ':app'
          GRADLE

          # root build.gradle
          cat > android-app/build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GRADLE

          # gradle.properties
          cat > android-app/gradle.properties << 'PROPS'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          PROPS

          # app/build.gradle
          cat > android-app/app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'uk.co.prlsitesolutions.prism'
              compileSdk 34
              defaultConfig {
                  applicationId "uk.co.prlsitesolutions.prism"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE

      - name: Build APK
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk ../PRISM.apk
          echo "APK built successfully!"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-APK
          path: PRISM.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PRISM v1.0 — Android App"
          body: |
            ## PRISM — Workforce Intelligence & Compliance Platform

            **Android App (APK)**

            Download and install on your Android device:
            1. Download PRISM.apk below
            2. Open the file on your phone
            3. Allow "Install from unknown sources" if prompted
            4. Sign in with your PRL credentials

            By PRL Site Solutions
          files: PRISM.apk
