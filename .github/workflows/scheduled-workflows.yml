name: PRISM Scheduled Workflows

# Runs the PRISM workflow agents (compliance chase, welcome, stale applicant).
# These have always been built but had no trigger — /api/workflows/run was written
# ready for a scheduler that was never wired up, so no automatic compliance expiry
# alert had ever fired.
on:
  schedule:
    # 07:15 UTC daily — before the working day, after any overnight deploy settles.
    - cron: "15 7 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PRISM workflow agents
        run: |
          echo "Triggering PRISM workflow agents..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://www.prismworkforce.online/api/workflows/run" \
            -H "Content-Type: application/json" \
            -H "x-workflow-secret: ${{ secrets.WORKFLOW_SECRET }}")

          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP $STATUS"
          echo "$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Workflow run failed with HTTP $STATUS"
            exit 1
          fi
