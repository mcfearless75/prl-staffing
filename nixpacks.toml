[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# prisma generate runs inside npm run build using the locally installed prisma (^6.x)
cmds = ["npm run build"]
cacheDirectories = [".next/cache"]

[start]
cmd = "node .next/standalone/server.js"

[variables]
NODE_ENV = "production"
DATABASE_URL = "postgresql://build:build@localhost/build"
