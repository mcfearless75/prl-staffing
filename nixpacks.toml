[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --prefer-offline"]
cacheDirectories = ["node_modules"]

[phases.build]
# Run prisma generate with an inline dummy URL (avoids DATABASE_URL validation error at build time)
# The real DATABASE_URL from Railway env vars is used at runtime only
cmds = [
  "DATABASE_URL='postgresql://build:build@localhost/build' npx prisma generate",
  "npm run build"
]
cacheDirectories = [".next/cache"]

[start]
cmd = "node .next/standalone/server.js"

[variables]
NODE_ENV = "production"
